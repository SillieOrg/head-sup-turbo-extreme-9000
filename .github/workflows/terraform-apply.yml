name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Terraform init (remote backend)
        working-directory: terraform/envs/dev
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET repository variable is required."
            exit 1
          fi
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'headsup/dev/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-west-2' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'headsup-terraform-locks' }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        working-directory: terraform/envs/dev
        run: |
          if [ -z "${{ vars.ALLOWED_ORIGIN }}" ]; then
            echo "ALLOWED_ORIGIN repository variable is required."
            exit 1
          fi
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'eu-west-2' }}" \
            -var="project_name=headsup" \
            -var="environment=dev" \
            -var="allowed_origin=${{ vars.ALLOWED_ORIGIN }}" \
            -var="log_retention_days=7" \
            -var="monthly_budget_usd=${{ vars.MONTHLY_BUDGET_USD || '5' }}" \
            -var="budget_alert_email=${{ vars.BUDGET_ALERT_EMAIL || '' }}"
