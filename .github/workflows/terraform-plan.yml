name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Terraform init (remote backend)
        working-directory: terraform/envs/dev
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'headsup/dev/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-west-2' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'headsup-terraform-locks' }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan (no refresh)
        working-directory: terraform/envs/dev
        run: |
          terraform plan -refresh=false \
            -var="aws_region=eu-west-2" \
            -var="project_name=headsup" \
            -var="environment=dev" \
            -var="allowed_origin=${{ vars.ALLOWED_ORIGIN || 'https://example.github.io' }}" \
            -var="log_retention_days=7" \
            -var="monthly_budget_usd=5" \
            -var="budget_alert_email="
